name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"

      - name: Install (fails if uv.lock is out of date)
        run: uv sync --locked

      - name: Install Chromium for the browser tests
        run: uv run playwright install chromium

      - name: Lint
        run: uv run ruff check .

      - name: Types
        run: uv run mypy src

      - name: Tests
        run: uv run pytest -q --junitxml=junit.xml

      - name: Name the failing tests on the run page
        if: failure()
        run: uv run python scripts/ci_annotate.py junit.xml

      - name: The benchmark suite is fair (no model needed)
        run: uv run aegis bench validate bench/suites/v1
