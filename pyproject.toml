[project]
name = "aegis"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "inkand-paper", email = "tabir8431@gmail.com" }
]
requires-python = ">=3.13.5"
dependencies = [
    "httpx>=0.28.1",
    "playwright>=1.64.0",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.16.0",
    "rich>=15.0.0",
]

[project.scripts]
aegis = "aegis.main:main"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
strict = true
python_version = "3.13"
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["uv_build>=0.13.3,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]
